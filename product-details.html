<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zippy Store - Product Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans antialiased">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="container mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <a href="index.html" class="flex items-center gap-2 text-xl font-bold tracking-tight text-slate-900 shrink-0">
        <svg class="w-6 h-6 text-teal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
        </svg>
        <span>Zippy Store</span>
      </a>

      <nav class="flex items-center gap-5 text-sm font-medium shrink-0">
        <a href="index.html" class="text-slate-600 hover:text-teal-700 transition">Home</a>
        <a href="wishlist.html" class="text-slate-600 hover:text-teal-700 transition flex items-center gap-1.5">
          <span>Wishlist</span>
          <span id="wishlist-count" class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold text-white bg-teal-700 rounded-full">2</span>
        </a>
        <a href="cart.html" class="text-slate-600 hover:text-teal-700 transition flex items-center gap-1.5">
          <span>Cart</span>
          <span id="cart-count" class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold text-white bg-teal-700 rounded-full">3</span>
        </a>
      </nav>

    </div>
  </header>

  <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
    <div class="mb-6">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 hover:text-teal-700 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Back to Products</span>
      </a>
    </div>

    <div id="product-detail-container">
      
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="container mx-auto px-4 text-center text-sm text-slate-500">
      <p>© 2026 Zippy Store — Your everyday essentials, all in one place. All rights reserved.</p>
    </div>
  </footer>
<div
  id="toast-container"
  class="fixed top-5 right-5 z-[9999] flex flex-col gap-3"
  aria-live="polite"
>
</div>
</body>
</html>
